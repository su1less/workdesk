<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工作台 · 我的秘书</title>
<link rel="stylesheet" href="css/style.css?v=20261030-pet10">
<link rel="stylesheet" href="css/immersive.css?v=20261030-pet10">
<link rel="stylesheet" href="css/wallpaper.css?v=20261030-pet10">
<link rel="stylesheet" href="css/pet.css?v=20261030-pet10">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>
<div id="wallpaper" aria-hidden="true"></div>
<div id="app">

  <!-- ===== 侧边栏 ===== -->
  <aside id="sidebar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">
        <div class="logo-name">工作台</div>
        <div class="logo-sub">My WorkDesk</div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-nav="dashboard" title="仪表盘">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>仪表盘</span>
      </button>
      <button class="nav-item" data-nav="today" title="今日">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-item" data-nav="week" title="本周">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/><line x1="15" y1="21" x2="15" y2="9"/></svg>
        <span>本周</span>
      </button>
      <button class="nav-item" data-nav="month" title="本月">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8.5" cy="14.5" r=".8"/><circle cx="12" cy="14.5" r=".8"/><circle cx="15.5" cy="14.5" r=".8"/><circle cx="8.5" cy="18" r=".8"/><circle cx="12" cy="18" r=".8"/></svg>
        <span>本月</span>
      </button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-nav="library" title="任务库">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r=".9"/><circle cx="3.5" cy="12" r=".9"/><circle cx="3.5" cy="18" r=".9"/></svg>
        <span>任务库</span>
      </button>
      <button class="nav-item" data-nav="refs" title="文献管理">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>文献管理</span>
      </button>
      <button class="nav-item" data-nav="reports" title="进度报告">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>进度报告</span>
      </button>
      <button class="nav-item" data-nav="docs" title="周报月报">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span>周报月报</span>
      </button>
      <button class="nav-item" data-nav="ai" title="AI 助手">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>AI 助手</span>
      </button>
      <button class="nav-item" data-nav="import" title="导入计划">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 9 12 14 17 9"/><line x1="12" y1="14" x2="12" y2="2"/></svg>
        <span>导入计划</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <button class="nav-item" data-act="open-settings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </button>
      <button class="nav-item" data-act="toggle-theme" title="切换主题">
        <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="themeLabel">深色模式</span>
      </button>
    </div>
  </aside>

  <!-- ===== 主区域 ===== -->
  <div id="main">
    <header id="topbar">
      <div class="tb-left">
        <h1 id="viewTitle">仪表盘</h1>
        <div id="viewSub" class="tb-sub"></div>
      </div>
      <div class="tb-right">
        <div class="quickadd">
          <svg viewBox="0 0 24 24" class="qa-icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <input id="quickInput" type="text" placeholder="快速添加：写周报 14:00-15:00 !高 #产品 明天" autocomplete="off">
        </div>
        <button class="btn btn-sudden" data-act="open-sudden">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          突发日程
        </button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <!-- ===== 移动端底部标签栏 ===== -->
  <nav id="tabbar">
    <button class="tab-item active" data-nav="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>仪表盘</span>
    </button>
    <button class="tab-item" data-nav="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span>今日</span>
    </button>
    <button class="tab-item" data-nav="week">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/><line x1="15" y1="21" x2="15" y2="9"/></svg>
      <span>本周</span>
    </button>
    <button class="tab-item" data-nav="month">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>本月</span>
    </button>
    <button class="tab-item" data-act="open-more">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      <span>更多</span>
    </button>
  </nav>

  <!-- ===== 移动端悬浮添加按钮 ===== -->
  <button class="fab" data-act="add-task-new" title="快速添加任务">＋</button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="loginRoot"></div>
