# 工作台 · 腾讯云轻量服务器部署（Ubuntu 22.04 + Docker）
#   首次：docker compose up -d --build
#   日志（查看初始密码）：docker logs workdesk
#   改密码：docker exec -it workdesk node server.js --set-password 新密码
#   升级：git pull && docker compose up -d --build
services:
  workdesk:
    build: .
    container_name: workdesk
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    # AI 助手自定义接口白名单（默认已放行 DeepSeek/智谱等官方域名，无需配置）：
    # environment:
    #   - WB_AI_HOSTS=api.example.com,api2.example.com
    restart: unless-stopped
